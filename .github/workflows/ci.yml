name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run demo
      - run: npm run bench:offline -- --assert
      - run: npm run bench:cost -- --assert
      - run: npm run bench:tokens -- --assert
      - run: npm run bench:learning -- --assert
      - run: npm run bench:discovery -- --assert
      - run: npm run bench:proxy -- --assert
      - run: npm run bench:workflow -- --assert
      - run: npm run bench:harbor -- --assert

  provenance:
    name: SWE-bench provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run bench:provenance
